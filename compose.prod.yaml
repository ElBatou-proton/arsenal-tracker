services:
  php:
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "9000:9000"
    volumes:
      - ./:/var/www/html
      - php_storage:/var/www/html/storage
      - vendor_storage:/var/www/html/vendor
    env_file:
      - .env.production
    depends_on:
      - database
      - redis
    networks:
      - arsenal-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - arsenal-network

  database:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: arsenal_root_secure_password
      MYSQL_DATABASE: arsenal_tracker
      MYSQL_USER: arsenal_user
      MYSQL_PASSWORD: arsenal_secure_password
      MYSQL_ROOT_HOST: "%"
    volumes:
      - mysql_data:/var/lib/mysql
      #- ./mysql.cnf:/etc/mysql/conf.d/mysql.cnf:ro
      #- ./mysql-init.sql:/docker-entrypoint-initdb.d/mysql-init.sql:ro
    command: --default-authentication-plugin=mysql_native_password --bind-address=0.0.0.0
    networks:
      - arsenal-network

  redis:
    image: redis:alpine
    volumes:
      - redis_data:/data
    networks:
      - arsenal-network

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: database
    depends_on:
      - database
    networks:
      - arsenal-network

volumes:
  php_storage:
  vendor_storage:
  mysql_data:
  redis_data:

networks:
  arsenal-network:
    driver: bridge
